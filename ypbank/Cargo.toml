[workspace]
members = ["."]
resolver = "2"

[package]
name = "ypbank"
version = "0.1.0"
edition = "2021"

[dependencies]
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
thiserror = "1.0"

[[bin]]
name = "ypbank_converter"
path = "src/bin/converter.rs"

[[bin]]
name = "ypbank_compare"
path = "src/bin/comparer.rs"

[lib]
name = "ypbank_parser"
path = "src/lib.rs"