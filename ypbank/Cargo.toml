[workspace]
members = ["."]
resolver = "2"

[package]
name = "ypbank"
version = "0.1.0"
edition = "2021"

[dependencies]
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }  # Важно: добавляем serde feature
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }

[[bin]]
name = "ypbank_converter"
path = "src/bin/converter.rs"

[[bin]]
name = "ypbank_compare"
path = "src/bin/comparer.rs"

[lib]
name = "ypbank_parser"
path = "src/lib.rs"